name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Hefesto/Hefesto.slnx

      - name: Build
        run: dotnet build Hefesto/Hefesto.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Hefesto/Hefesto.slnx --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Publish (single-file exe)
        run: dotnet publish Hefesto/Gui/Hefesto.Gui.csproj --configuration Release --no-build --output publish --self-contained true -r win-x64 -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true

      - name: Prepare release artifact
        run: |
          cd publish
          7z a ../Hefesto-v${{ github.ref_name }}.zip . -mx=9

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Hefesto-v${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false